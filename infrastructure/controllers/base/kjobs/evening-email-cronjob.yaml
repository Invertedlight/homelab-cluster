apiVersion: batch/v1
kind: CronJob
metadata:
  name: evening-email-triage
  namespace: kjobs
spec:
  schedule: "40 17 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: evening-email-triage
              image: alpine/curl
              imagePullPolicy: IfNotPresent
              env:
                - name: URL
                  valueFrom:
                    secretKeyRef:
                      name: secret-webhook-email-triage
                      key: URL
                - name: KEY
                  valueFrom:
                    secretKeyRef:
                      name: secret-webhook-email-triage
                      key: KEY
              command:
                - /bin/sh
                - -c
                - >
                  code=$(curl -sS -o /dev/null -w "%{http_code}"
                  -X POST "$URL"
                  -H "Authorization: Bearer $KEY"
                  -H "Content-Type: application/json"
                  -d '{"source":"evening email triage"}');
                  echo "$code"
          restartPolicy: OnFailure
