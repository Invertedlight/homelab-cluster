# Applies to every volume in the "default" group (volumes without their own
# recurring-job labels). Target: Garage S3 bucket "longhorn".
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: nightly-backup
  namespace: longhorn-system
spec:
  task: backup
  cron: "0 1 * * *"
  retain: 7
  concurrency: 2
  groups: [default]
  labels:
    schedule: nightly
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-snapshot-cleanup
  namespace: longhorn-system
spec:
  task: snapshot-cleanup
  cron: "30 3 * * 0"
  retain: 0
  concurrency: 2
  groups: [default]
