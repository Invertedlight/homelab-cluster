apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-rpc
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: garage
      ports:
        - {protocol: TCP, port: 3901}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-s3-clients
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
        - podSelector:
            matchLabels:
              app: garage-rclone
      ports:
        - {protocol: TCP, port: 3900}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app: garage
      ports:
        - {protocol: TCP, port: 3903}
