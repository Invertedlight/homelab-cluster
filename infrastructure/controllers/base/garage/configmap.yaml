apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"
    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"
    block_size = "1048576"
    replication_factor = 3
    consistency_mode = "consistent"
    compression_level = 1
    rpc_bind_addr = "[::]:3901"
    # rpc_secret / admin_token come from GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN.

    [kubernetes_discovery]
    namespace = "garage"
    service_name = "garage"
    skip_crd = true

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.internal"

    [admin]
    api_bind_addr = "[::]:3903"
