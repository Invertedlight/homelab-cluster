apiVersion: v1
kind: Service
metadata:
  name: garage
  labels:
    app: garage
spec:
  selector:
    app: garage
  ports:
    - {name: s3-api, port: 3900, targetPort: 3900}
    - {name: admin, port: 3903, targetPort: 3903}
---
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  labels:
    app: garage
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: garage
  ports:
    - {name: rpc, port: 3901, targetPort: 3901}
