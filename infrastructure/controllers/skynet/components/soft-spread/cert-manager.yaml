# controller, webhook and cainjector: one replica each, all three were on
# skynet-wrk-04 on Nov 16. startupapicheck (a hook Job) is unchanged.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  values:
    podLabels: &labels
      skynet.jameshomelab.org/spread: infra
    affinity: &affinity
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [skynet-wrk-04]
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
              labelSelector:
                matchLabels:
                  skynet.jameshomelab.org/spread: infra
    topologySpreadConstraints: &spread
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            skynet.jameshomelab.org/spread: infra
    webhook:
      podLabels: *labels
      affinity: *affinity
      topologySpreadConstraints: *spread
    cainjector:
      podLabels: *labels
      affinity: *affinity
      topologySpreadConstraints: *spread
