# controller, webhook and cainjector: two replicas each with a
# PodDisruptionBudget (minAvailable 1). The controller and cainjector use
# leader election (Lease in kube-system), so the second copy is a hot
# standby; both webhook copies serve requests. Each component prefers its two
# copies on different nodes (weight 100), then away from other infra pods
# and from skynet-wrk-04. All preferences; nothing is required.
# startupapicheck (a hook Job) is unchanged.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  values:
    replicaCount: 2
    podDisruptionBudget: &pdb
      enabled: true
      minAvailable: 1
    podLabels: &labels
      skynet.jameshomelab.org/spread: infra
    affinity:
      nodeAffinity: &avoidWrk04
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [skynet-wrk-04]
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: cert-manager
                  app.kubernetes.io/component: controller
          - &infraTerm
            weight: 50
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
              labelSelector:
                matchLabels:
                  skynet.jameshomelab.org/spread: infra
    topologySpreadConstraints: &spread
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            skynet.jameshomelab.org/spread: infra
    webhook:
      replicaCount: 2
      podDisruptionBudget: *pdb
      podLabels: *labels
      affinity:
        nodeAffinity: *avoidWrk04
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: cert-manager
                    app.kubernetes.io/component: webhook
            - *infraTerm
      topologySpreadConstraints: *spread
    cainjector:
      replicaCount: 2
      podDisruptionBudget: *pdb
      podLabels: *labels
      affinity:
        nodeAffinity: *avoidWrk04
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: cert-manager
                    app.kubernetes.io/component: cainjector
            - *infraTerm
      topologySpreadConstraints: *spread
