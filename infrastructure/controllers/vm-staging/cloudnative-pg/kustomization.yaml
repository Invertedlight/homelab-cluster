# Same operator chart as infrastructure/controllers/base/cloudnative-pg.
# PodMonitors stay off until monitoring-controllers is Ready. The CRDs
# come from that release; this overlay does not wait on it.
# This directory has no Secret, so the Flux Kustomization has no decryption block.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cloudnative-pg
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: cloudnative-pg
    patch: |-
      - op: replace
        path: /spec/values/monitoring/podMonitorEnabled
        value: false
      - op: replace
        path: /spec/values/resources
        value:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            memory: 96Mi
      - op: add
        path: /spec/values/config
        value:
          data:
            LOG_LEVEL: error
          maxConcurrentReconciles: 2
      - op: add
        path: /spec/values/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/values/podLabels
        value:
          homelab.jameshomelab.org/schedule: vm-staging
      - op: add
        path: /spec/values/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
