# Staging infrastructure. Do not reference a production directory that
# contains a Secret, a production address, or a production hostname.
#
# Included, from base, because those directories have no Secret and no
# address:
# - cert-manager: controller only. No Issuer and no ACME solver. The
#   ServiceMonitor stays off. Turn it on only after monitoring-controllers
#   is Ready and the Prometheus Operator CRDs exist.
# - coredns-custom: kube-system ConfigMap. Rewrites search-domain hijacks
#   inside this cluster. It does not create DNS records.
# - kured: Sunday reboot window, one node at a time. No Secret.
#
# Included, local overlay:
# - cloudflared: namespace and Deployment from base (that directory has no
#   Secret). The token is tunnel vm-staging, encrypted for the vm-staging
#   age recipient, not the skynet token.
#
# Left out:
# - kube-vip: base address is 192.168.68.40 on eno1. Staging VIP is
#   192.168.68.160. The VM NIC name is not in this repo, so it is not guessed.
# - traefik-tls: production wildcard certificate jameshomelab-wildcard-tls.
#   k3s already ships Traefik.
# - csi-smb: StorageClass source //192.168.68.70/PVC (Mac mini RaidShare)
#   and the linkding smb-credentials Secret.
# - garage: production SOPS keys, and a nightly rclone copy onto RaidShare.
#   Also too heavy for 10/15 GiB disks.
# - longhorn: backup target is production Garage, Ingress host is
#   longhorn.jameshomelab.org, and replicas do not fit these disks.
# - cnpg-barman-plugin: waits on the CNPG operator, which is not listed yet,
#   and its backups need object storage this cluster does not have.
# - renovate: production token, and it opens pull requests against this repo.
# - kjobs: production email-triage webhook Secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager
  - ../base/coredns-custom
  - ../base/kured
  - cloudflared
patches:
  # kured stays a DaemonSet, including on the control plane, so Sunday
  # reboots still reach the servers. A 32Mi limit (PR 177) made each server
  # re-read kured's own pages from the shared NVMe, 90-490 MB/s, until etcd
  # lost quorum. 128Mi is the limit that stopped that. The request is 64Mi.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: kured
    patch: |-
      - op: add
        path: /spec/values/resources
        value:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
