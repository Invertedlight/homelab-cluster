apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpod-nodeport
  namespace: devpod
  labels:
    app.kubernetes.io/name: devpod-nodeport
    app.kubernetes.io/part-of: homelab-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-nodeport
  namespace: devpod
  labels:
    app.kubernetes.io/name: devpod-nodeport
    app.kubernetes.io/part-of: homelab-dev
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["devpod"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-nodeport
  namespace: devpod
  labels:
    app.kubernetes.io/name: devpod-nodeport
    app.kubernetes.io/part-of: homelab-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devpod-nodeport
subjects:
  - kind: ServiceAccount
    name: devpod-nodeport
    namespace: devpod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpod-nodeport
  namespace: devpod
  labels:
    app.kubernetes.io/name: devpod-nodeport
    app.kubernetes.io/part-of: homelab-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devpod-nodeport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpod-nodeport
        app.kubernetes.io/part-of: homelab-dev
    spec:
      serviceAccountName: devpod-nodeport
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [skynet-wrk-01, skynet-wrk-02, skynet-wrk-03]
      containers:
        - name: reconciler
          image: rancher/kubectl:v1.32.9
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              ns=devpod
              sts=devpod
              base=32222
              while true; do
                replicas="$(kubectl -n "$ns" get sts "$sts" -o jsonpath='{.spec.replicas}' 2>/dev/null || true)"
                uid="$(kubectl -n "$ns" get sts "$sts" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
                if [ -z "$replicas" ] || [ -z "$uid" ]; then
                  echo "statefulset $sts not found"
                  sleep 20
                  continue
                fi
                i=0
                while [ "$i" -lt "$replicas" ]; do
                  name="devpod-${i}-ssh"
                  port="$((base + i))"
                  printf '%s\n' \
                    'apiVersion: v1' \
                    'kind: Service' \
                    'metadata:' \
                    "  name: ${name}" \
                    "  namespace: ${ns}" \
                    '  labels:' \
                    '    app.kubernetes.io/name: devpod' \
                    '    app.kubernetes.io/part-of: homelab-dev' \
                    '    app.kubernetes.io/managed-by: devpod-nodeport' \
                    '  ownerReferences:' \
                    '    - apiVersion: apps/v1' \
                    '      kind: StatefulSet' \
                    "      name: ${sts}" \
                    "      uid: ${uid}" \
                    'spec:' \
                    '  type: NodePort' \
                    '  selector:' \
                    "    statefulset.kubernetes.io/pod-name: devpod-${i}" \
                    '  ports:' \
                    '    - name: ssh' \
                    '      port: 2222' \
                    '      targetPort: 2222' \
                    "      nodePort: ${port}" \
                    | kubectl -n "$ns" apply -f -
                  i=$((i + 1))
                done
                kubectl -n "$ns" get svc -l app.kubernetes.io/managed-by=devpod-nodeport -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | while read -r svcname; do
                  [ -n "$svcname" ] || continue
                  ordinal="${svcname#devpod-}"
                  ordinal="${ordinal%-ssh}"
                  case "$ordinal" in
                    ''|*[!0-9]*) continue ;;
                  esac
                  if [ "$ordinal" -ge "$replicas" ]; then
                    kubectl -n "$ns" delete svc "$svcname"
                  fi
                done
                sleep 20
              done
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
