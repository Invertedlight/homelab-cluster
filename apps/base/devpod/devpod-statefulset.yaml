apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devpod
  namespace: devpod
  labels:
    app.kubernetes.io/name: devpod
    app.kubernetes.io/part-of: homelab-dev
spec:
  serviceName: devpod
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: devpod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpod
        app.kubernetes.io/part-of: homelab-dev
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [skynet-wrk-01, skynet-wrk-02, skynet-wrk-03]
      initContainers:
        - name: home-perms
          image: mcr.microsoft.com/devcontainers/base:debian
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /home/vscode
              if [ ! -f /home/vscode/.profile ]; then
                cp -a /etc/skel/. /home/vscode/ 2>/dev/null || true
              fi
              chown -R 1000:1000 /home/vscode
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /home/vscode
        # Base environment: GitHub auth, Invertedlight/dotfiles setup,
        # mise + tools. Full run only when ~/.devpod-bootstrap-done is
        # missing (new home volume); otherwise skips. Always exits 0;
        # result in ~/.devpod-bootstrap.status and ~/.devpod-bootstrap.log.
        - name: bootstrap
          image: mcr.microsoft.com/devcontainers/base:debian
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/devpod-bootstrap/bootstrap.sh"]
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/vscode
            - name: bootstrap
              mountPath: /opt/devpod-bootstrap
              readOnly: true
            - name: github-credentials
              mountPath: /etc/devpod/github
              readOnly: true
      containers:
        - name: workspace
          image: mcr.microsoft.com/devcontainers/base:debian
          imagePullPolicy: IfNotPresent
          # base:debian has no ssh-init.sh. Install openssh as root, listen
          # on 2222, then stay up. A man-db trigger must not fail the pod.
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -uo pipefail
              # git credential helper, GH_TOKEN, zsh login shell, mise PATH.
              /opt/devpod-bootstrap/devpod-runtime.sh || echo "devpod-runtime failed"
              if ! command -v sshd >/dev/null 2>&1; then
                mkdir -p /etc/dpkg/dpkg.cfg.d
                printf 'path-exclude=/usr/share/man/*\npath-exclude=/usr/share/doc/*\n' > /etc/dpkg/dpkg.cfg.d/01-nodoc
                rm -f /var/lib/man-db/auto-update
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server file || true
              fi
              mkdir -p /var/run/sshd /home/vscode/.ssh
              ssh-keygen -A || true
              if [ -f /etc/ssh/sshd_config ]; then
                sed -i 's/^#\?Port .*/Port 2222/' /etc/ssh/sshd_config
                grep -q '^Port 2222' /etc/ssh/sshd_config || echo 'Port 2222' >> /etc/ssh/sshd_config
                sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
                sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
              fi
              chown -R vscode:vscode /home/vscode/.ssh || true
              chmod 700 /home/vscode/.ssh || true
              if [ -x /usr/sbin/sshd ]; then
                /usr/sbin/sshd || echo "sshd failed to start"
              else
                echo "sshd binary missing after install"
              fi
              # Homebrew on the home PVC (/home/linuxbrew); installs as
              # vscode only when missing. Background so sshd is not delayed.
              /opt/devpod-bootstrap/devpod-brew.sh &
              exec sleep infinity
          securityContext:
            runAsUser: 0
          ports:
            - name: ssh
              containerPort: 2222
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/vscode
            # Homebrew prefix on the same PVC so it survives restarts.
            - name: home
              mountPath: /home/linuxbrew
              subPath: .linuxbrew-root
            - name: scratch
              mountPath: /scratch
            - name: bootstrap
              mountPath: /opt/devpod-bootstrap
              readOnly: true
            - name: github-credentials
              mountPath: /etc/devpod/github
              readOnly: true
      volumes:
        - name: scratch
          persistentVolumeClaim:
            claimName: devpod-scratch
        - name: bootstrap
          configMap:
            name: devpod-bootstrap
            defaultMode: 0755
        # SOPS secret from apps/staging/devpod/github-credentials.yaml.
        # Root-only on disk; devpod-runtime.sh copies the token to
        # /run/devpod-github (container fs, not the PVC) for vscode.
        - name: github-credentials
          secret:
            secretName: github-credentials
            optional: true
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: home
        labels:
          app.kubernetes.io/name: devpod
          app.kubernetes.io/part-of: homelab-dev
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
