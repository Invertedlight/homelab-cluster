apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devpod
  namespace: devpod
  labels:
    app.kubernetes.io/name: devpod
    app.kubernetes.io/part-of: homelab-dev
spec:
  serviceName: devpod
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: devpod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpod
        app.kubernetes.io/part-of: homelab-dev
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [skynet-wrk-01, skynet-wrk-02, skynet-wrk-03]
      initContainers:
        - name: home-perms
          image: mcr.microsoft.com/devcontainers/base:debian
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /home/vscode
              if [ ! -f /home/vscode/.profile ]; then
                cp -a /etc/skel/. /home/vscode/ 2>/dev/null || true
              fi
              chown -R 1000:1000 /home/vscode
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /home/vscode
      containers:
        - name: workspace
          image: mcr.microsoft.com/devcontainers/base:debian
          imagePullPolicy: IfNotPresent
          # base:debian has no ssh-init.sh. Install openssh as root, listen
          # on 2222, then stay up. SSH login is vscode. Skip man-db triggers;
          # mandb looks hung and is not needed in this pod.
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              if ! command -v sshd >/dev/null 2>&1; then
                echo 'man-db man-db/auto-update boolean false' | debconf-set-selections
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server
              fi
              mkdir -p /var/run/sshd /home/vscode/.ssh
              ssh-keygen -A
              sed -i 's/^#\?Port .*/Port 2222/' /etc/ssh/sshd_config
              grep -q '^Port 2222' /etc/ssh/sshd_config || echo 'Port 2222' >> /etc/ssh/sshd_config
              sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
              sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
              chown -R vscode:vscode /home/vscode/.ssh
              chmod 700 /home/vscode/.ssh
              /usr/sbin/sshd
              exec sleep infinity
          securityContext:
            runAsUser: 0
          ports:
            - name: ssh
              containerPort: 2222
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/vscode
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          persistentVolumeClaim:
            claimName: devpod-scratch
  volumeClaimTemplates:
    - metadata:
        name: home
        labels:
          app.kubernetes.io/name: devpod
          app.kubernetes.io/part-of: homelab-dev
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
