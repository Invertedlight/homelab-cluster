apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - devpod-scratch-pvc.yaml
  - service.yaml
  - serviceaccount-devpod.yaml
  - clusterrolebinding-devpod-admin.yaml
  - devpod-statefulset.yaml
  - nodeport-controller.yaml
configMapGenerator:
  # Bootstrap scripts for every DevPod replica. The name gets a content
  # hash, so editing a script rolls the StatefulSet. No secrets here.
  - name: devpod-bootstrap
    namespace: devpod
    files:
      - bootstrap/bootstrap.sh
      - bootstrap/devpod-runtime.sh
      - bootstrap/git-credential-devpod
      - bootstrap/devpod-brew.sh
