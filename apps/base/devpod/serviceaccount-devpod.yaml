# Identity for the DevPod workspace pods (StatefulSet/devpod). kubectl inside
# the pod uses this account's mounted token automatically (in-cluster config),
# so no ~/.kube/config is needed. Bound to cluster-admin by
# clusterrolebinding-devpod-admin.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpod
  namespace: devpod
  labels:
    app.kubernetes.io/name: devpod
    app.kubernetes.io/part-of: homelab-dev
automountServiceAccountToken: true
