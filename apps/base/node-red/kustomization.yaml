apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - node-red-data-longhorn.yaml
configMapGenerator:
  - name: node-red-settings
    files:
      - settings.js
  # Flow exports, palette/package.json, and the sync script. The hash suffix
  # rolls the pod when any of these change. The sync step leaves an existing
  # /data/flows.json and flows_cred.json in place.
  - name: node-red-gitops
    files:
      - sync-gitops.sh
      - sync-gitops.js
      - palette/package.json
      - flows/weather-flow.json
