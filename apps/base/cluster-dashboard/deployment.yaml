apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-dashboard
  labels:
    app: cluster-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-dashboard
  template:
    metadata:
      labels:
        app: cluster-dashboard
    spec:
      serviceAccountName: cluster-dashboard
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      containers:
        - name: cluster-dashboard
          image: ghcr.io/invertedlight/cluster-dashboard:0.4.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Chicago
            - name: BASE_DOMAIN
              value: jameshomelab.org
            - name: PUBLIC_HOST
              value: home.jameshomelab.org
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cluster-dashboard-database
                  key: uri
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cluster-dashboard-database
                  key: secret-key
            # Edit login (0.4.0). optional: if the Secret is missing the pod still
            # starts, the home page works and editing stays disabled (fail closed).
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cluster-dashboard-auth
                  key: admin-username
                  optional: true
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: cluster-dashboard-auth
                  key: admin-password-hash
                  optional: true
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-dashboard-auth
                  key: session-secret
                  optional: true
            - name: TOTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-dashboard-auth
                  key: totp-secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: icons
              mountPath: /app/app/static/icons
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: icons
          configMap:
            name: cluster-dashboard-icons
