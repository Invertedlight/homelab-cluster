apiVersion: apps/v1
kind: Deployment
metadata:
  name: netwatch
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch
    app.kubernetes.io/part-of: skynet
    app.kubernetes.io/component: probe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netwatch
      app.kubernetes.io/component: probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netwatch
        app.kubernetes.io/part-of: skynet
        app.kubernetes.io/component: probe
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - skynet-wrk-01
                      - skynet-wrk-02
                      - skynet-wrk-03
                      - skynet-wrk-04
      containers:
        - name: netwatch
          # alpine/curl is BusyBox 1.37 (nc -z, awk, date) plus curl for the
          # monthly HTTPS post. nc -z is an unprivileged TCP connect.
          image: alpine/curl:8.22.0@sha256:f05779b04a6f3c6f228c67118786f5c80d4c4922dd79b0b24c92dc10a74f594f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/probe.sh", "run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: netwatch-config
          env:
            - name: HOME
              value: /tmp
            - name: DATA_DIR
              value: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'hb=$(cat /data/heartbeat 2>/dev/null || echo 0); now=$(date +%s); test $((now - hb)) -lt 180'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netwatch-data
        - name: scripts
          configMap:
            name: netwatch-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
