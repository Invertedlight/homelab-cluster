apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netwatch
resources:
  - namespace.yaml
  - pvc.yaml
  - sms-webhook-secret.yaml
  - deployment.yaml
  - cronjob.yaml
generatorOptions:
  labels:
    app.kubernetes.io/name: netwatch
    app.kubernetes.io/part-of: skynet
configMapGenerator:
  - name: netwatch-config
    literals:
      - GATEWAY_HOST=192.168.68.1
      - GATEWAY_PORTS=443,80
      - EXTERNAL_PROBES=1.1.1.1:443,8.8.8.8:443,one.one.one.one:443
      - PROBE_INTERVAL_SECONDS=30
      - SUSTAIN_SECONDS=60
      - CONNECT_TIMEOUT_SECONDS=3
  - name: netwatch-scripts
    files:
      - probe.sh
      - report.sh
      - time.awk
      - report.awk
