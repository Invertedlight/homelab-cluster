apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      initContainers:
        - name: copy-passwd
          image: eclipse-mosquitto:2
          command:
            [
              "sh",
              "-c",
              "cp /secret/passwd /mosquitto/auth/passwd && chown 1883:1883 /mosquitto/auth/passwd && chmod 0600 /mosquitto/auth/passwd",
            ]
          volumeMounts:
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
              name: mqtt
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: auth
              mountPath: /mosquitto/auth
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: secret
          secret:
            secretName: mosquitto-passwd
        - name: auth
          emptyDir: {}
