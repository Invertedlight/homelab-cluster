apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: audiobookshelf
resources:
  - namespace.yaml
  - service.yaml
  - audiobookshelf-deployment.yaml
  - audiobookshelf-pvc-data.yaml
  - audiobookshelf-pvc-library.yaml
  - audiobookshelf-pvc-library-smb.yaml
  - audiobookshelf-pvc-data-longhorn.yaml
  - audiobookshelf-backup-cronjob.yaml
configMapGenerator:
  - name: audiobookshelf-backup-scripts
    files:
      - backup.js
