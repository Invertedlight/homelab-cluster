apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID

      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          ports:
            - containerPort: 13378
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap
          volumeMounts:
            - name: app-data
              mountPath: /config
              subPath: config
            - name: app-data
              mountPath: /metadata
              subPath: metadata
            - name: library
              mountPath: /audiobooks
              subPath: audiobooks
            - name: library
              mountPath: /podcasts
              subPath: podcasts
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: audiobookshelf-data
        - name: library
          persistentVolumeClaim:
            claimName: audiobookshelf-library
