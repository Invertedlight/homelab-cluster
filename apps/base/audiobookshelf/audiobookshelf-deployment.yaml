apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID

      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          ports:
            - containerPort: 13378
              securityContext:
                allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap
          resources:
            requests:
              ephemeral-storage: "1Gi"
            limits:
              ephemeral-storage: "2Gi"
          volumeMounts:
            - name: config
              mountPath: "/config"
            - name: metadata
              mountPath: "/metadata"
            - name: library
              mountPath: "/Library"
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 200Mi
        - name: metadata
          emptyDir:
            sizeLimit: 200Mi
        - name: library
          emptyDir:
            sizeLimit: 200Mi
