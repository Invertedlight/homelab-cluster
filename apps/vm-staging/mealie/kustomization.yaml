# Data claim stays 5Gi and moves to local-path-workers. No SMB and no backup.
# mealie-database reuses the password already in
# apps/vm-staging/database/homelab-postgres-mealie-secret.yaml.
# ALLOW_SIGNUP stays at the base value, false. The first staging account
# already exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie
resources:
  - ../../base/mealie/
  - ingress.yaml
  - mealie-database-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mealie
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 160Mi
          limits:
            memory: 288Mi
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: WARNING
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://mealie-staging.jameshomelab.org
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: mealie-data-longhorn
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path-workers
