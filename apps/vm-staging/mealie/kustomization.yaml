# Data claim stays 5Gi and moves to local-path. No SMB and no backup.
# mealie-database is not in this directory yet. Its password has to be the
# one already in apps/vm-staging/database/homelab-postgres-mealie-secret.yaml.
# ALLOW_SIGNUP is true only so the empty database can take the first
# account. Set it back to false after that account exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie
resources:
  - ../../base/mealie/
  - ingress.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mealie
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://mealie-staging.jameshomelab.org
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "true"
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: mealie-data-longhorn
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
