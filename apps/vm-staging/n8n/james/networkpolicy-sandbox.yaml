# Let staging n8n reach the staging sandbox and SearXNG. In-cluster only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-egress-sandbox
spec:
  podSelector:
    matchLabels:
      app: n8n
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n-sandbox
          podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n-sandbox
          podSelector:
            matchLabels:
              app: searxng
      ports:
        - {protocol: TCP, port: 8080}
