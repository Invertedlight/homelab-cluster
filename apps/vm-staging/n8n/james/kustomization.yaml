# Staging James n8n. No Gloria overlay, no BlueBubbles egress, no SMB backup.
# n8n-credentials reuses the password already in
# apps/vm-staging/database/homelab-postgres-n8n-james-secret.yaml.
# The Brave key is the production key, re-encrypted to the vm-staging age
# recipient. N8N_ENCRYPTION_KEY is new, not copied from production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n-james
labels:
  - pairs:
      n8n.jameshomelab.org/customer: james
    includeSelectors: false
resources:
  - ../../../base/n8n/
  - ingress.yaml
  - networkpolicy-sandbox.yaml
  - n8n-credentials-secret.yaml
  - brave-search-api-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: n8n
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 160Mi
          limits:
            memory: 288Mi
      # Index 8 is N8N_RUNNERS_ENABLED. The sandbox chart is the code runner.
      - op: replace
        path: /spec/template/spec/containers/0/env/8/value
        value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: N8N_LOG_LEVEL
          value: warn
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: n8n-staging.jameshomelab.org
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://n8n-staging.jameshomelab.org/
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: n8n_james
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: n8n-data-longhorn
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: n8n-backup-smb
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: n8n-db-backup
