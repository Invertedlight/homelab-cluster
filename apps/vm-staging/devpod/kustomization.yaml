# In-cluster DevPod only. One replica. No nodeport controller, no NodePort,
# no tunnel, and no Homebrew install. Home stays local-path 20Gi. Scratch
# stays a 10Gi local-path claim. The shared 500Gi NAS claim is not applied.
# Quota requests.storage is 40Gi (one home and one scratch claim are 30Gi).
# github-credentials is not in this directory yet. Create it on the Mac mini
# with a new fine-grained token and add the file to resources before merge.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devpod
resources:
  - ../../base/devpod/
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: devpod
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 64Mi
      - op: replace
        path: /spec/template/spec/initContainers/1/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 352Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 352Mi
      # Same startup as the base, without the background Homebrew installer.
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: |
          set -uo pipefail
          /opt/devpod-bootstrap/devpod-runtime.sh || echo "devpod-runtime failed"
          if ! command -v sshd >/dev/null 2>&1; then
            mkdir -p /etc/dpkg/dpkg.cfg.d
            printf 'path-exclude=/usr/share/man/*\npath-exclude=/usr/share/doc/*\n' > /etc/dpkg/dpkg.cfg.d/01-nodoc
            rm -f /var/lib/man-db/auto-update
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server file || true
          fi
          mkdir -p /var/run/sshd /home/vscode/.ssh
          if ! ls /etc/ssh/ssh_host_*_key >/dev/null 2>&1; then
            echo "no persistent host keys; generating (will change on restart)"
            ssh-keygen -A || true
          fi
          if [ -f /etc/ssh/sshd_config ]; then
            sed -i 's/^#\?Port .*/Port 2222/' /etc/ssh/sshd_config
            grep -q '^Port 2222' /etc/ssh/sshd_config || echo 'Port 2222' >> /etc/ssh/sshd_config
            sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
            sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          fi
          chown -R vscode:vscode /home/vscode/.ssh || true
          chmod 700 /home/vscode/.ssh || true
          if [ -x /usr/sbin/sshd ]; then
            /usr/sbin/sshd || echo "sshd failed to start"
          else
            echo "sshd binary missing after install"
          fi
          exec sleep infinity
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: remove
        path: /spec/template/spec/volumes/0
      - op: add
        path: /spec/volumeClaimTemplates/-
        value:
          metadata:
            name: scratch
            labels:
              app.kubernetes.io/name: devpod
              app.kubernetes.io/part-of: homelab-dev
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 10Gi
  - target:
      version: v1
      kind: ResourceQuota
      name: devpod-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.storage
        value: 40Gi
      - op: replace
        path: /spec/hard/requests.cpu
        value: 200m
      - op: replace
        path: /spec/hard/requests.memory
        value: 256Mi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "1"
      - op: replace
        path: /spec/hard/limits.memory
        value: 512Mi
      - op: replace
        path: /spec/hard/pods
        value: "4"
  - target:
      version: v1
      kind: LimitRange
      name: devpod-limits
    patch: |-
      - op: replace
        path: /spec/limits/0/defaultRequest/cpu
        value: 20m
      - op: replace
        path: /spec/limits/0/defaultRequest/memory
        value: 32Mi
      - op: replace
        path: /spec/limits/0/default/cpu
        value: 100m
      - op: replace
        path: /spec/limits/0/default/memory
        value: 64Mi
      - op: replace
        path: /spec/limits/0/max/cpu
        value: 500m
      - op: replace
        path: /spec/limits/0/max/memory
        value: 352Mi
      - op: replace
        path: /spec/limits/1/max/storage
        value: 20Gi
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: devpod-scratch-raidshare
        namespace: devpod
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: devpod-nodeport
        namespace: devpod
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: devpod-nodeport
        namespace: devpod
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: devpod-nodeport
        namespace: devpod
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: devpod-nodeport
        namespace: devpod
