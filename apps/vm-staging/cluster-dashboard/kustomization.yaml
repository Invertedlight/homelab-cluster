# PUBLIC_HOST is the staging name. No TLS secret: Cloudflare terminates
# HTTPS. cluster-dashboard-database is not in this directory yet. Its
# password has to be the one already in
# apps/vm-staging/database/homelab-postgres-dashboard-secret.yaml.
# Create that file on the Mac mini with the vm-staging age key before
# this app can connect. Do not generate a second database password.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-dashboard
resources:
  - ../../base/cluster-dashboard/
  - ingress.yaml
  - cluster-dashboard-auth-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cluster-dashboard
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: cluster-dashboard-staging.jameshomelab.org
