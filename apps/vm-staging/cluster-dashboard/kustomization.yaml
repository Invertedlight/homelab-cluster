# PUBLIC_HOST is the staging name. No TLS secret: Cloudflare terminates
# HTTPS. cluster-dashboard-database reuses the password already in
# apps/vm-staging/database/homelab-postgres-dashboard-secret.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-dashboard
resources:
  - ../../base/cluster-dashboard/
  - ingress.yaml
  - cluster-dashboard-auth-secret.yaml
  - cluster-dashboard-database-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cluster-dashboard
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: cluster-dashboard-staging.jameshomelab.org
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            memory: 96Mi
