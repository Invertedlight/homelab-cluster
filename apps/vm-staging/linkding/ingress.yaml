apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  annotations:
    dashboard.jameshomelab.org/enable: "true"
    dashboard.jameshomelab.org/name: "Linkding"
    dashboard.jameshomelab.org/description: "Bookmark manager"
spec:
  ingressClassName: traefik
  rules:
    - host: linkding-staging.jameshomelab.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 9090
