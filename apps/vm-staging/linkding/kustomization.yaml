# One local-path claim. The base also creates an unused local-path PVC
# (with a production volumeName), an SMB PVC, and a Longhorn PVC. Those
# three are deleted here. linkding-database reuses the password already in
# apps/vm-staging/database/homelab-postgres-linkding-secret.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linkding
resources:
  - ../../base/linkding/
  - linkding-data.yaml
  - ingress.yaml
  - linkding-container-env-secret.yaml
  - linkding-database-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: linkding
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: replace
        path: /spec/template/spec/containers/0/env/6/value
        value: https://linkding-staging.jameshomelab.org
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: linkding-data
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: linkding-data-longhorn
        namespace: linkding
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: linkding-data-pvc
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: linkding-data-smb
