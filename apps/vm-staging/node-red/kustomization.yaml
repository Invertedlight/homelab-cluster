# local-path-workers data volume. Anonymous /ui viewing comes from the base
# settings (http-node-auth.js). The editor still requires the admin user.
# Cloudflare Access on the staging host is James-only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: node-red
resources:
  - ../../base/node-red/
  - ingress.yaml
  - node-red-admin-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: node-red
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: replace
        path: /spec/template/spec/initContainers/0/resources
        value:
          requests:
            cpu: 40m
            memory: 80Mi
          limits:
            memory: 192Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 40m
            memory: 80Mi
          limits:
            memory: 160Mi
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: node-red-data-longhorn
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path-workers
