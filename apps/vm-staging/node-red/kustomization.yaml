# local-path data volume. Anonymous /ui viewing comes from the base
# settings (http-node-auth.js). The editor still requires the admin user.
# Cloudflare Access on the staging host is James-only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: node-red
resources:
  - ../../base/node-red/
  - ingress.yaml
  - node-red-admin-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: node-red
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: node-red-data-longhorn
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
