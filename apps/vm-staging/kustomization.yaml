# Database, stateless apps, linkding and mealie, then the local-volume apps.
# clusters/vm-staging/apps.yaml applies this directory after
# infrastructure-controller and database-operator.
# devpod is omitted so Flux prunes it. The overlay stays at ./devpod,
# including its SOPS secret, and can be added back to this list.
# audiobookshelf is omitted so Flux prunes it, including its staging PVCs.
# The overlay stays at ./audiobookshelf and can be added back to this list.
# apps/base/audiobookshelf and apps/skynet/audiobookshelf are unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database
  - mosquitto
  - cluster-dashboard
  - linkding
  - mealie
  - netwatch
  - node-red
  - n8n
  - n8n-sandbox
