# Database, stateless apps, linkding and mealie, then the local-volume apps.
# clusters/vm-staging/apps.yaml applies this directory after
# infrastructure-controller and database-operator.
# Staging RAM and SATA SSD upgrades are done, so every overlay in this
# directory is listed and runs at its normal replica count.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database
  - mosquitto
  - cluster-dashboard
  - linkding
  - mealie
  - netwatch
  - node-red
  - n8n
  - n8n-sandbox
  - devpod
  - audiobookshelf
