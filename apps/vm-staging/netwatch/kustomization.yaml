# Local log only. report.sh skips the POST when url or token is empty or
# starts with PLACEHOLDER (apps/base/netwatch/report.sh). These values are
# not the production webhook. The monthly job still writes the report file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netwatch
resources:
  - ../../base/netwatch
  - netwatch-sms-webhook-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: netwatch
    patch: |-
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 48Mi
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: netwatch-monthly-report
    patch: |-
      # The probe deployment still records outages. This monthly file is optional.
      - op: add
        path: /spec/suspend
        value: true
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/affinity/nodeAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 48Mi
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: netwatch-data
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
