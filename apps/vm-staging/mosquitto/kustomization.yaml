# ClusterIP only. The base Service is a LoadBalancer; this overlay removes
# that exposure. No Ingress and no NodePort. mosquitto-passwd is the hash
# file the broker mounts. mosquitto-login is the same password, encrypted,
# and is not mounted. Decrypt it with the vm-staging age key to connect.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mosquitto
resources:
  - ../../base/mosquitto/
  - mosquitto-passwd.yaml
  - mosquitto-login.yaml
patches:
  - path: service-clusterip.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mosquitto
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      - op: add
        path: /spec/template/metadata/labels/homelab.jameshomelab.org~1schedule
        value: vm-staging
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                homelab.jameshomelab.org/schedule: vm-staging
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 48Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
