apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    dashboard.jameshomelab.org/enable: "true"
    dashboard.jameshomelab.org/name: "Linkding"
    dashboard.jameshomelab.org/description: "Bookmark manager"
  name: linkding
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lds.jameshomelab.org
  rules:
    - host: lds.jameshomelab.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 9090
