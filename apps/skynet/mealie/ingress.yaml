apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    dashboard.jameshomelab.org/enable: "true"
    dashboard.jameshomelab.org/name: "Mealie"
    dashboard.jameshomelab.org/description: "Recipes and meal planning"
  name: mealie
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mealie.jameshomelab.org
  rules:
    - host: mealie.jameshomelab.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 9000
