# EXAMPLE TEMPLATE - NOT ENCRYPTED - DO NOT COMMIT REAL VALUES IN THIS FILE.
# Copy to node-red-admin-secret.yaml, fill in the values, then encrypt with sops
# before committing. Do not add this example file to kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: node-red-admin
  namespace: node-red
type: Opaque
stringData:
  admin-user: CHANGE_ME_USERNAME
  admin-hash: CHANGE_ME_BCRYPT_HASH        # from the hash command, starts with $2y$08$ (hash-pw) or $2a$08$ (bcryptjs)
  credential-secret: CHANGE_ME_HEX_64      # from: openssl rand -hex 32
