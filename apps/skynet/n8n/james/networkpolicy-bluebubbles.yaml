# Let James' n8n send iMessage replies through BlueBubbles on the Mac mini.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-egress-bluebubbles
spec:
  podSelector:
    matchLabels:
      app: n8n
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.68.70/32
      ports:
        - {protocol: TCP, port: 1234}
