apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-dashboard
resources:
  - ../../base/cluster-dashboard/
  - ingress.yaml
  - cluster-dashboard-database-secret.yaml
  - cluster-dashboard-auth-secret.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cluster-dashboard
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cluster-dashboard
      spec:
        template:
          metadata:
            annotations:
              homelab/auth-rotated: "2026-11-17"
