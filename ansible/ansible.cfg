[defaults]
# Relative to this file's directory when Ansible resolves config paths from
# the working directory. scripts/node-rebuild.zsh also sets ANSIBLE_ROLES_PATH
# to an absolute path so the playbooks work from the repo root.
roles_path = roles
inventory = inventory/hosts.yaml
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
nocows = True
forks = 1
gathering = smart

[inventory]
host_pattern_mismatch = error

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
ssh_args = -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
