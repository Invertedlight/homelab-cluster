---
# Read ~/.kube/config on the controller and keep only the current context's
# server URL. The file contains client certificates. no_log stays on every
# task that still holds the file body.
- name: Set the skynet kubeconfig path
  ansible.builtin.set_fact:
    skynet_kubeconfig: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config"
    skynet_api_server: https://192.168.68.40:6443

- name: Read the controller kubeconfig
  ansible.builtin.slurp:
    src: "{{ skynet_kubeconfig }}"
  register: skynet_kubeconfig_raw
  delegate_to: localhost
  become: false
  no_log: true

- name: Parse the current context server
  ansible.builtin.set_fact:
    skynet_kubeconfig_data: "{{ skynet_kubeconfig_raw.content | b64decode | from_yaml }}"
  no_log: true

- name: Record the current context cluster name
  ansible.builtin.set_fact:
    skynet_context_name: "{{ skynet_kubeconfig_data['current-context'] }}"
    skynet_context_cluster: "{{ item.context.cluster }}"
  loop: "{{ skynet_kubeconfig_data['contexts'] }}"
  when: item.name == skynet_kubeconfig_data['current-context']
  no_log: true

- name: Record the API server URL
  ansible.builtin.set_fact:
    skynet_context_server: "{{ item.cluster.server }}"
  loop: "{{ skynet_kubeconfig_data['clusters'] }}"
  when: item.name == skynet_context_cluster
  no_log: true

- name: Forget the kubeconfig body
  ansible.builtin.set_fact:
    skynet_kubeconfig_data: ""
    skynet_kubeconfig_raw: ""
  no_log: true

- name: Require the skynet API VIP
  ansible.builtin.assert:
    that:
      - skynet_context_server == skynet_api_server
    fail_msg: >-
      The current context of ~/.kube/config must use server
      https://192.168.68.40:6443. Refusing to continue.
