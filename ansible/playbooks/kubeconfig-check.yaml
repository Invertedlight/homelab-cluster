---
# Confirm ~/.kube/config's current context is the skynet API VIP.
# Does not call the Kubernetes API.
- name: Check the controller kubeconfig
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require the skynet kubeconfig
      ansible.builtin.include_tasks: ../tasks/kubeconfig-skynet.yaml

    - name: Report the selected server
      ansible.builtin.debug:
        msg: "current context {{ skynet_context_name }} server {{ skynet_context_server }}"
