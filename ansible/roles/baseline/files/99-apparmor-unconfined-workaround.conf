# Workaround for the AppArmor SIGURG regression.
# kernel.apparmor_restrict_unprivileged_unconfined = 0 lets unprivileged
# user namespaces receive SIGURG the way containerd expects.
# Remove this file once containerd PR 14487 ships in the k3s release we install.
kernel.apparmor_restrict_unprivileged_unconfined = 0
