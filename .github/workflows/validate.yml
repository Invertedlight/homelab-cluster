# Offline validation for the skynet Flux repo.
# Production Flux root: clusters/skynet. Second root: clusters/vm-staging.
# This workflow never talks to the cluster and uses no credentials. It does
# not block merge until branch protection requires the offline-validation check.
# The ansible job syntax-checks playbooks and lints them. It does not connect
# to a node or to the Kubernetes API.
name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  offline-validation:
    name: offline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Do not let a self-hosted runner, or a stray kubeconfig, point these
      # tools at a cluster. kustomize build and kubeconform do not need one.
      KUBECONFIG: /dev/null
      KUBERNETES_SERVICE_HOST: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: |
          set -euo pipefail
          bindir="${HOME}/.local/bin"
          mkdir -p "${bindir}"
          case "$(uname -m)" in
            x86_64)
              kustomize_asset="kustomize_v5.8.3_linux_amd64.tar.gz"
              kustomize_sha="cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"
              kubeconform_asset="kubeconform-linux-amd64.tar.gz"
              kubeconform_sha="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
              ;;
            aarch64)
              kustomize_asset="kustomize_v5.8.3_linux_arm64.tar.gz"
              kustomize_sha="9867b76482cfc6d25b546abc1d2b5a32bd137505aba640649b4b378f64f6d68f"
              kubeconform_asset="kubeconform-linux-arm64.tar.gz"
              kubeconform_sha="1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87"
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/${kustomize_asset}"
          echo "${kustomize_sha}  ${tmp}/kustomize.tar.gz" | sha256sum -c -
          tar -xzf "${tmp}/kustomize.tar.gz" -C "${bindir}" kustomize
          curl -fsSL -o "${tmp}/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v0.8.0/${kubeconform_asset}"
          echo "${kubeconform_sha}  ${tmp}/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "${tmp}/kubeconform.tar.gz" -C "${bindir}" kubeconform
          chmod 755 "${bindir}/kustomize" "${bindir}/kubeconform"
          python3 -m venv "${tmp}/venv"
          "${tmp}/venv/bin/pip" install --disable-pip-version-check \
            "yamllint==1.38.0" \
            "pathspec==1.1.1" \
            "PyYAML==6.0.3"
          echo "${bindir}" >> "${GITHUB_PATH}"
          echo "${tmp}/venv/bin" >> "${GITHUB_PATH}"
          "${bindir}/kustomize" version
          "${bindir}/kubeconform" -v
          "${tmp}/venv/bin/python" -m yamllint --version

      - name: Validate manifests offline
        run: python3 .github/scripts/validate-offline.py

  ansible-offline:
    name: ansible-offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Syntax-check and ansible-lint do not connect. A stray kubeconfig
      # must not become a default for a later step.
      KUBECONFIG: /dev/null
      KUBERNETES_SERVICE_HOST: ""
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      ANSIBLE_HOST_PATTERN_MISMATCH: error
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Ansible tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh
          python3 -m venv "${HOME}/ansible-venv"
          "${HOME}/ansible-venv/bin/pip" install --disable-pip-version-check \
            "ansible-core==2.18.8" \
            "ansible-lint==25.8.2"
          echo "${HOME}/ansible-venv/bin" >> "${GITHUB_PATH}"
          ansible --version
          ansible-lint --version
          zsh --version

      - name: Syntax-check the wrapper
        run: |
          set -euo pipefail
          zsh -n scripts/node-rebuild.zsh
          zsh scripts/node-rebuild.zsh plan skynet-wrk-01 >/tmp/node-rebuild-plan.txt
          grep -q 'node-rebuild-prepare.yaml' /tmp/node-rebuild-plan.txt
          grep -q 'node-baseline.yaml' /tmp/node-rebuild-plan.txt
          grep -q 'k3s-join.yaml' /tmp/node-rebuild-plan.txt
          grep -q 'os-unattended-upgrades.yaml' /tmp/node-rebuild-plan.txt
          grep -q 'k3s-upstream-resolv.yaml' /tmp/node-rebuild-plan.txt
          grep -q 'node-rebuild-verify.yaml' /tmp/node-rebuild-plan.txt
          if zsh scripts/node-rebuild.zsh plan not-a-node; then
            echo "plan accepted a host outside the inventory" >&2
            exit 1
          fi

      - name: Syntax-check playbooks
        run: |
          set -euo pipefail
          for playbook in ansible/playbooks/*.yaml; do
            ansible-playbook --syntax-check -i ansible/inventory/hosts.yaml \
              "$playbook" -e target_host=skynet-wrk-01
          done
          ansible-playbook --list-hosts -i ansible/inventory/hosts.yaml \
            ansible/playbooks/node-baseline.yaml -e target_host=skynet-wrk-01 \
            | grep -q 'skynet-wrk-01'
          if ansible-playbook --list-hosts -i ansible/inventory/hosts.yaml \
            ansible/playbooks/node-baseline.yaml -e target_host=not-a-node; then
            echo "a host outside the inventory was accepted" >&2
            exit 1
          fi
          # These runs fail on the controller. They do not open SSH.
          if ansible-playbook -i ansible/inventory/hosts.yaml \
            ansible/playbooks/node-baseline.yaml \
            -e target_host=skynet-cp-01 --limit skynet-wrk-01; then
            echo "a mismatched --limit was accepted" >&2
            exit 1
          fi
          if ansible-playbook -i ansible/inventory/hosts.yaml \
            ansible/playbooks/node-baseline.yaml \
            --limit 'skynet-wrk-01,skynet-wrk-02'; then
            echo "two hosts were accepted" >&2
            exit 1
          fi

      - name: Lint Ansible
        working-directory: ansible
        run: ansible-lint

      - name: Check kubeconfig context selection offline
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "${fixture}/.kube"
          python3 - <<PY
          from pathlib import Path
          Path("${fixture}/.kube/config").write_text(
              "apiVersion: v1\n"
              "kind: Config\n"
              "current-context: skynet\n"
              "contexts:\n"
              "  - name: skynet\n"
              "    context:\n"
              "      cluster: skynet\n"
              "      user: skynet\n"
              "  - name: rancher-desktop\n"
              "    context:\n"
              "      cluster: rancher-desktop\n"
              "      user: rancher-desktop\n"
              "clusters:\n"
              "  - name: rancher-desktop\n"
              "    cluster:\n"
              "      server: https://127.0.0.1:6443\n"
              "  - name: skynet\n"
              "    cluster:\n"
              "      server: https://192.168.68.40:6443\n"
              "users:\n"
              "  - name: skynet\n"
              "    user:\n"
              "      token: fixture-not-a-secret\n"
          )
          PY
          home_kubeconfig="${fixture}/.kube/config"
          # The task reads HOME/.kube/config. Point HOME at the fixture.
          if ! output="$(HOME="${fixture}" ansible-playbook -i ansible/inventory/hosts.yaml ansible/playbooks/kubeconfig-check.yaml)"; then
            printf '%s\n' "$output" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'https://192.168.68.40:6443'
          if printf '%s\n' "$output" | grep -q 'fixture-not-a-secret'; then
            echo "kubeconfig check printed the fixture credential" >&2
            exit 1
          fi
          python3 - <<PY
          from pathlib import Path
          text = Path("${home_kubeconfig}").read_text()
          text = text.replace("current-context: skynet", "current-context: rancher-desktop", 1)
          Path("${home_kubeconfig}").write_text(text)
          PY
          if HOME="${fixture}" ansible-playbook -i ansible/inventory/hosts.yaml ansible/playbooks/kubeconfig-check.yaml; then
            echo "rancher-desktop context was accepted" >&2
            exit 1
          fi
