apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-operator
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/cloudnative-pg
  prune: true
