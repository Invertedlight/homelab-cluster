# First bootstrap stage: Flux only.
# These files stay in this directory and are not applied yet:
#   infrastructure.yaml, then monitoring.yaml and database-operator.yaml,
#   then apps.yaml.
# Add them to resources in that order in later PRs.
# apps.yaml depends on infrastructure-controller and database-operator, so
# it has to be last.
# infrastructure, monitoring, and apps already set decryption to sops /
# sops-age. database-operator does not, matching skynet: that path has no
# Secret. flux-system stays in this list. Dropping it after it is in
# status.inventory would prune Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
