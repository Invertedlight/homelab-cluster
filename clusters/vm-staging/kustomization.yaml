# Flux, infrastructure, the CNPG operator, then apps. monitoring.yaml stays
# in this directory and is not applied yet. apps.yaml depends on
# infrastructure-controller and database-operator, so it stays last.
# infrastructure, monitoring, and apps set decryption to sops / sops-age.
# database-operator does not: that path has no Secret.
# flux-system stays in this list. Dropping it after it is in
# status.inventory would prune Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure.yaml
  - database-operator.yaml
  - apps.yaml
