# Local and CI build of the vm-staging Flux objects. There is no flux-system/
# directory yet. Do not add one by bootstrapping until the age recipient in
# .sops.yaml is set.
#
# When Flux is bootstrapped later, add `flux-system` to resources in the
# same commit that adds clusters/vm-staging/flux-system/. A root
# kustomization.yaml that omits flux-system after those objects are in
# status.inventory would prune Flux. Before the first reconcile, bootstrap
# installs the controllers outside inventory, so they are not pruned, but
# they are also not managed until this list includes them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apps.yaml
  - database-operator.yaml
  - infrastructure.yaml
  - monitoring.yaml
