# Flux, infrastructure, the CNPG operator, apps, then monitoring.
# apps.yaml depends on infrastructure-controller and database-operator.
# It does not depend on monitoring. monitoring.yaml is last.
# infrastructure, monitoring, and apps set decryption to sops / sops-age.
# database-operator does not: that path has no Secret.
# flux-system stays in this list. Dropping it after it is in
# status.inventory would prune Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure.yaml
  - database-operator.yaml
  - apps.yaml
  - monitoring.yaml
