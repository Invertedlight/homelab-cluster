# Not reconciled by production Flux. Production builds clusters/skynet only.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: infrastructure-controller
    - name: database-operator
  # Not listed in clusters/vm-staging/kustomization.yaml yet. When it is,
  # stay unready until the database pods are up.
  wait: true
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/vm-staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
