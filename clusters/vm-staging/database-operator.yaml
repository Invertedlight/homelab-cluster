# Not reconciled by production Flux. Production builds clusters/skynet only.
# Wrapper turns PodMonitors off. The path has no Secret, so there is no
# decryption block. wait is true so apps, once listed, do not start until
# the Helm release is Ready. Production sets wait: false because that
# operator was already running.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-operator
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/vm-staging/cloudnative-pg
  prune: true
