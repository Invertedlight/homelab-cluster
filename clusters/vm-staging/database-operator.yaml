# Not reconciled by production Flux.
# Same shared operator manifest production uses. That directory has no
# Secret and no node IP. Remove this file before bootstrap if vm-staging
# should not install CloudNativePG yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-operator
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/cloudnative-pg
  prune: true
