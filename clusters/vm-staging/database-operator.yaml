# Not reconciled by production Flux. Not listed in kustomization.yaml yet.
# Same shared operator manifest production uses. That directory has no
# Secret and no node IP, so this object has no decryption block, matching
# skynet. Remove this file before it is listed if vm-staging should not
# install CloudNativePG.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-operator
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/base/cloudnative-pg
  prune: true
