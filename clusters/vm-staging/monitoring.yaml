# Not reconciled by production Flux. Production builds clusters/skynet only.
# Name is monitoring-controllers. Production keeps the live typo
# monitoring-controlers; that object must not be renamed.
# Apps do not wait on this. The Helm release creates the monitoring namespace,
# so the first install does not depend on another Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 1m
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers/vm-staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Empty on purpose: no PrometheusRules and no alert routes. dependsOn keeps
# a later config from applying before the namespace and CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 1m0s
  retryInterval: 1m
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/configs/vm-staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
