apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  # Grafana's first start on a new major replays its database migrations
  # (about 4.5 minutes for Grafana 13 on Nov 14, plus a ~2 minute image pull).
  # 25m covers the 20 minute Grafana startupProbe with room to spare.
  timeout: 25m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.2.2"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    timeout: 25m
    # Retry a failed upgrade in place every 5m; never roll back automatically.
    # A stuck release stays visible (FluxReconciliationFailed) instead.
    remediation:
      retries: 3
      remediateLastFailure: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      affinity:
        # Soft placement only (preferred, never required): if the preferred nodes
        # are down or full, the scheduler still uses any node, wrk-04 included.
        # skynet-wrk-04 is the laptop on a smart-plug battery cycle (docs/os-updates.md).
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [skynet-wrk-04]
        podAntiAffinity:
          # Prefer a different node from the other core monitoring pods, so one
          # node loss does not take Prometheus, Alertmanager and Grafana together.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [prometheus, alertmanager]
      # Keep grafana.db on a Longhorn volume so a rollout no longer rebuilds the
      # database from scratch (~600 SQLite migrations, about 4.5 minutes for
      # Grafana 13 on Nov 14). Default Longhorn backup group applies (nightly
      # to Garage). The chart's initChownData and fsGroup 472 set ownership.
      persistence:
        enabled: true
        type: pvc
        storageClassName: longhorn
        accessModes: [ReadWriteOnce]
        size: 2Gi
      # ReadWriteOnce: the default rolling update starts the new pod while the
      # old pod still holds the volume. maxSurge 0 / maxUnavailable 1 runs one
      # pod at a time: the old pod stops and releases the volume before the new
      # one starts, so there is no multi-attach and no second SQLite writer.
      # For one replica that is the same as Recreate. type: Recreate is rejected
      # on upgrade: helm-controller uses server-side apply, the API server's
      # defaulted rollingUpdate block has no field owner so it stays, and
      # Recreate forbids it (rollingUpdate: null and {} fail the same way).
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      # Liveness and readiness wait until this passes. It allows up to 20
      # minutes for a major-version migration before the container is restarted.
      startupProbe:
        httpGet:
          path: /api/health
          port: grafana
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 120
      # Deployment default is 600s; Helm treated the Nov 14 rollout as failed
      # when it passed. Must exceed the startupProbe window plus image pull.
      progressDeadlineSeconds: 1500
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      # Merged into the chart's default grafana.ini. Sign-ups are already off by
      # default; set explicitly so a chart/default change can't turn them on.
      grafana.ini:
        users:
          allow_sign_up: false
      # Grafana-managed alerting for multi-tenant n8n (Telegram contact point).
      # Alertmanager -> BlueBubbles (sms receiver) is unchanged.
      sidecar:
        alerts:
          enabled: true
          label: grafana_alert
          labelValue: "1"
          searchNamespace: monitoring
      envValueFrom:
        TELEGRAM_BOT_TOKEN:
          secretKeyRef:
            name: grafana-telegram
            key: bot-token
            optional: true
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          dashboard.jameshomelab.org/enable: "true"
          dashboard.jameshomelab.org/name: "Grafana"
          dashboard.jameshomelab.org/description: "Cluster metrics and dashboards"
        hosts:
          - grs.jameshomelab.org
    alertmanager:
      alertmanagerSpec:
        # The chart's own "soft" preset only repels other replicas of the same
        # component (we run one) and would replace podAntiAffinity below.
        podAntiAffinity: ""
        affinity:
          # Soft placement only (preferred, never required): if the preferred nodes
          # are down or full, the scheduler still uses any node, wrk-04 included.
          # skynet-wrk-04 is the laptop on a smart-plug battery cycle (docs/os-updates.md).
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: [skynet-wrk-04]
          podAntiAffinity:
            # Prefer a different node from the other core monitoring pods, so one
            # node loss does not take Prometheus, Alertmanager and Grafana together.
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 50
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [prometheus, grafana]
        # Pin past 0.27.0: it panics when a url_file webhook gets an error reply
        # (prometheus/alertmanager#3798, fixed in 0.28.0 by #3800).
        image:
          registry: quay.io
          repository: prometheus/alertmanager
          tag: v0.28.1
        # Mounts Secret alertmanager-sms-webhook at
        # /etc/alertmanager/secrets/alertmanager-sms-webhook/{url,token}.
        secrets:
          - alertmanager-sms-webhook
      config:
        # Setting inhibit_rules replaces the chart default list, so the four
        # chart rules are copied here unchanged. Maintenance rules are added
        # below them. group_by, group_wait, group_interval, repeat_interval,
        # and send_resolved are unchanged.
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
          - target_matchers:
              - 'alertname = InfoInhibitor'
          # Source alerts are PrometheusRules in
          # monitoring/configs/skynet/kube-prometheus-stack/node-maintenance-alerts.yaml.
          # They are routed to null below; inhibition does not require a notification.
          # Same-node: any other alert that already carries this node name.
          - source_matchers:
              - 'alertname = NodeInMaintenance'
            target_matchers:
              - 'alertname !~ "NodeInMaintenance|GarageNodeInMaintenance"'
            equal:
              - node
          # No node label. One marked node mutes these names for the whole cluster
          # until the label is removed. KubeDaemonSetNotScheduled is the same
          # DaemonSet failure mode as MisScheduled and RolloutStuck.
          - source_matchers:
              - 'alertname = NodeInMaintenance'
            target_matchers:
              - 'alertname =~ "TargetDown|KubeDaemonSetMisScheduled|KubeDaemonSetRolloutStuck|KubeDaemonSetNotScheduled|KubePodNotReady"'
          # Garage is pinned to skynet-wrk-02/03/04. Mute its nodeless alerts only
          # while one of those nodes is marked, not during maintenance of any node.
          - source_matchers:
              - 'alertname = GarageNodeInMaintenance'
            target_matchers:
              - 'alertname =~ "GarageClusterUnhealthy|GarageStorageNodesDegraded"'
          - source_matchers:
              - 'alertname = GarageNodeInMaintenance'
            target_matchers:
              - 'alertname = KubeStatefulSetReplicasMismatch'
              - 'namespace = garage'
              - 'statefulset = garage'
        route:
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          # Re-notify a still-firing alert every 6h.
          repeat_interval: 6h
          receiver: sms
          routes:
            # NodeDown: one loud CRITICAL ANNOUNCE text per down node, repeated
            # every 30m until acked ("cmd ack [node]" creates a silence for
            # alertname=NodeDown). The kured maintenance-failure page is the same
            # alertname, so this route, the 30m repeat, and that silence cover it.
            # The PrometheusRule decides when it fires; this route does not match
            # any other alert. continue: false so the default route does not send
            # a second copy every 6h.
            - receiver: sms-critical
              matchers:
                - alertname = "NodeDown"
              group_by: ["node"]
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 30m
            # Watchdog and InfoInhibitor are always firing; keep them off the phone.
            # NodeInMaintenance and GarageNodeInMaintenance are inhibit sources only.
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor|NodeInMaintenance|GarageNodeInMaintenance"
        receivers:
          - name: "null"
          - name: sms
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-sms-webhook/url
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-sms-webhook/token
          # Same webhook and secret as sms; the routine formats NodeDown as CRITICAL.
          - name: sms-critical
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-sms-webhook/url
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-sms-webhook/token
    prometheus:
      prometheusSpec:
        # The chart's own "soft" preset only repels other replicas of the same
        # component (we run one) and would replace podAntiAffinity below.
        podAntiAffinity: ""
        affinity:
          # Soft placement only (preferred, never required): if the preferred nodes
          # are down or full, the scheduler still uses any node, wrk-04 included.
          # skynet-wrk-04 is the laptop on a smart-plug battery cycle (docs/os-updates.md).
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: [skynet-wrk-04]
              # Lighter preference for workers: keep the TSDB's disk and Longhorn
              # traffic off the etcd control-plane nodes when a worker has room.
              - weight: 30
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
          podAntiAffinity:
            # Prefer a different node from the other core monitoring pods, so one
            # node loss does not take Prometheus, Alertmanager and Grafana together.
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 50
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [alertmanager, grafana]
        # TSDB on Longhorn instead of an emptyDir, so a pod restart or upgrade
        # keeps history. Measured Nov 14 on Prometheus 3.16: ~11.8k samples/s
        # and ~344k head series, about 10.2e9 samples per 10 days, or ~15-20 GB
        # at 1.5-2 bytes per sample. retentionSize deletes the oldest blocks
        # before the volume fills; it sits under the PVC size to leave room for
        # the WAL and compaction. Grow later with Longhorn volume expansion.
        retention: 10d
        retentionSize: 25GB
        storageSpec:
          volumeClaimTemplate:
            metadata:
              labels:
                # Opt out of the default Longhorn group (nightly backup to
                # Garage). Metrics are not worth backing up; keep only the
                # weekly snapshot cleanup.
                recurring-job.longhorn.io/source: enabled
                recurring-job.longhorn.io/weekly-snapshot-cleanup: enabled
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 30Gi
        # Webhook routine prefixes SMS texts with this label, e.g. [Skynet].
        externalLabels:
          cluster: Skynet
    # K3s runs kube-scheduler, kube-controller-manager, and kube-proxy inside
    # the k3s process, not as pods, and their metrics listen on localhost.
    # The chart's ServiceMonitors therefore have no targets, and the Down
    # alerts stay firing. Disable the scrapes and the matching default rules.
    prometheusOperator:
      affinity:
        # Soft placement only (preferred, never required): if the preferred nodes
        # are down or full, the scheduler still uses any node, wrk-04 included.
        # skynet-wrk-04 is the laptop on a smart-plug battery cycle (docs/os-updates.md).
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [skynet-wrk-04]
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false
        kubeProxy: false
    # Flux v2.9 controllers no longer export gotk_reconcile_condition. Readiness
    # lives on the custom resources, so kube-state-metrics (already scraped by
    # this release) exports gotk_resource_info. Default collectors stay enabled.
    # A stored artifact does not keep Ready=True: the metric copies
    # status.conditions[type=Ready], which is False while fetch is failing.
    kube-state-metrics:
      affinity:
        # Soft placement only (preferred, never required): if the preferred nodes
        # are down or full, the scheduler still uses any node, wrk-04 included.
        # skynet-wrk-04 is the laptop on a smart-plug battery cycle (docs/os-updates.md).
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [skynet-wrk-04]
      # kube_node_labels only includes Kubernetes labels named here.
      # `maintenance=true` is the node maintenance marker (docs/node-maintenance.md).
      metricLabelsAllowlist:
        - "nodes=[maintenance]"
      # kube_node_annotations is empty unless an annotation key is listed.
      # kured 1.23 already sets weave.works/kured-reboot-in-progress
      # (annotateNodes: true). The key is exposed as
      # annotation_weave_works_kured_reboot_in_progress. See docs/node-reboot-alerts.md.
      metricAnnotationsAllowList:
        - "nodes=[weave.works/kured-reboot-in-progress]"
      rbac:
        extraRules:
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources:
              - gitrepositories
              - helmrepositories
              - helmcharts
              - buckets
              - ocirepositories
              - externalartifacts
            verbs: ["list", "watch"]
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["list", "watch"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux GitRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath: &fluxReadyLabels
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          reason: [status, conditions, "[type=Ready]", reason]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux HelmRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux HelmChart.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux Bucket.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux OCIRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: ExternalArtifact
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux ExternalArtifact.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux Kustomization.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux HelmRelease.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
