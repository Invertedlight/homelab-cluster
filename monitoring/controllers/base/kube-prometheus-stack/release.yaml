apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.2.2"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grs.jameshomelab.org
    alertmanager:
      alertmanagerSpec:
        # Mounts Secret alertmanager-sms-webhook at
        # /etc/alertmanager/secrets/alertmanager-sms-webhook/{url,token}.
        secrets:
          - alertmanager-sms-webhook
      config:
        route:
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          # Re-notify a still-firing alert every 6h.
          repeat_interval: 6h
          receiver: sms
          routes:
            # Watchdog and InfoInhibitor are always firing; keep them off the phone.
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        receivers:
          - name: "null"
          - name: sms
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-sms-webhook/url
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-sms-webhook/token
    prometheus:
      prometheusSpec:
        # Webhook routine prefixes SMS texts with this label, e.g. [Skynet].
        externalLabels:
          cluster: Skynet
    # K3s runs kube-scheduler, kube-controller-manager, and kube-proxy inside
    # the k3s process, not as pods, and their metrics listen on localhost.
    # The chart's ServiceMonitors therefore have no targets, and the Down
    # alerts stay firing. Disable the scrapes and the matching default rules.
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false
        kubeProxy: false
    # Flux v2.9 controllers no longer export gotk_reconcile_condition. Readiness
    # lives on the custom resources, so kube-state-metrics (already scraped by
    # this release) exports gotk_resource_info. Default collectors stay enabled.
    # A stored artifact does not keep Ready=True: the metric copies
    # status.conditions[type=Ready], which is False while fetch is failing.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources:
              - gitrepositories
              - helmrepositories
              - helmcharts
              - buckets
              - ocirepositories
              - externalartifacts
            verbs: ["list", "watch"]
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["list", "watch"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux GitRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath: &fluxReadyLabels
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          reason: [status, conditions, "[type=Ready]", reason]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux HelmRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux HelmChart.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux Bucket.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux OCIRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: ExternalArtifact
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux ExternalArtifact.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux Kustomization.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Current readiness of a Flux HelmRelease.
                    each:
                      type: Info
                      info:
                        labelsFromPath: *fluxReadyLabels
