apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-postgres-backups
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab-postgres.backups
      rules:
        - alert: HomelabPostgresBackupFailed
          expr: kube_job_failed{namespace="database",job_name=~"homelab-postgres-backup-.*",condition="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: homelab-postgres nightly backup job failed
            description: Inspect the failed Job logs in the database namespace. Previous dumps stay on the homelab-postgres-backup-smb share.
        - alert: HomelabPostgresBackupStale
          expr: (time() - kube_cronjob_status_last_successful_time{namespace="database",cronjob="homelab-postgres-backup"} > 93600) or ((time() - kube_cronjob_created{namespace="database",cronjob="homelab-postgres-backup"} > 93600) unless on(namespace,cronjob) kube_cronjob_status_last_successful_time{namespace="database",cronjob="homelab-postgres-backup"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: homelab-postgres has no successful backup within 26 hours
            description: Check the CronJob, recent Jobs, the backup role and SMB storage.
        - alert: HomelabPostgresBackupScheduleUnavailable
          expr: (kube_cronjob_spec_suspend{namespace="database",cronjob="homelab-postgres-backup"} == 1) or absent(kube_cronjob_info{namespace="database",cronjob="homelab-postgres-backup"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: homelab-postgres backup CronJob is suspended or missing
            description: Restore the CronJob from Git (apps/base/database/backup-cronjob.yaml).
