# Internal UI. Public through the *.jameshomelab.org tunnel wildcard, so a
# Cloudflare Access app for alertmanager.jameshomelab.org MUST exist before this is merged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    dashboard.jameshomelab.org/enable: "true"
    dashboard.jameshomelab.org/name: "Alertmanager"
    dashboard.jameshomelab.org/description: "Alert routing and silences"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - alertmanager.jameshomelab.org
  rules:
    - host: alertmanager.jameshomelab.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-alertmanager
                port:
                  number: 9093
