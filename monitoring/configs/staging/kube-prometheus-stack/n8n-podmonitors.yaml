# The CNPG-generated PodMonitor lacks release=kube-prometheus-stack, so Prometheus
# never scraped homelab-postgres. This one is selected by the Prometheus CR.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: homelab-postgres-metrics
  namespace: database
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: homelab-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cnpg_cluster
---
# Traefik exposes traefik_tls_certs_not_after (wildcard cert expiry) on :9100.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: kube-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
---
# n8n /metrics (N8N_METRICS=true) for every customer namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: n8n
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: n8n
  podMetricsEndpoints:
    - port: http
      path: /metrics
