apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage-backups
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: garage.s3
      rules:
        - alert: GarageMetricsMissing
          expr: absent(cluster_healthy{namespace="garage"})
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: Garage S3 is not reporting metrics
            description: Check the garage StatefulSet (namespace garage) on wrk-02/03/04.
        - alert: GarageClusterUnhealthy
          expr: min(cluster_healthy{namespace="garage"}) < 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Garage cluster is unhealthy
            description: Run `kubectl -n garage exec garage-0 -- /garage status`.
        - alert: GarageStorageNodesDegraded
          expr: min(cluster_storage_nodes_ok{namespace="garage"}) < 3
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Garage has fewer than 3 healthy storage nodes
            description: Data is still readable with 2 of 3, but replication factor 3 is not met.
        - alert: GarageDiskLow
          expr: min by (pod) (garage_local_disk_avail{namespace="garage",volume="data"} / garage_local_disk_total{namespace="garage",volume="data"}) < 0.15
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Garage data disk on {{ $labels.pod }} is below 15% free
    - name: cnpg.barman
      rules:
        - alert: CNPGWalArchivingFailing
          expr: cnpg_pg_stat_archiver_last_failed_time{namespace="database"} > cnpg_pg_stat_archiver_last_archived_time{namespace="database"}
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: homelab-postgres WAL archiving to Garage is failing on {{ $labels.pod }}
            description: Check the plugin-barman-cloud sidecar logs and Garage. Unarchived WAL accumulates in pg_wal.
        - alert: CNPGBaseBackupStale
          expr: time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database"}) > 93600
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: homelab-postgres has no base backup in Garage newer than 26 hours
            description: Check ScheduledBackup homelab-postgres-nightly and `kubectl -n database get backups.postgresql.cnpg.io`.
        - alert: CNPGBaseBackupFailed
          expr: max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="database"}) > max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database"})
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: The latest homelab-postgres base backup failed
    - name: backup.jobs
      rules:
        - alert: LonghornNightlyBackupStale
          expr: (time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob="nightly-backup"} > 93600) or ((time() - kube_cronjob_created{namespace="longhorn-system",cronjob="nightly-backup"} > 93600) unless on(namespace,cronjob) kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob="nightly-backup"})
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Longhorn nightly backup to Garage has not succeeded in 26 hours
        - alert: GarageOffsiteCopyFailed
          expr: kube_job_failed{namespace="garage",job_name=~"garage-rclone-copy-.*",condition="true"} == 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Nightly rclone copy of Garage to smb-32tb failed
        - alert: GarageOffsiteCopyStale
          expr: (time() - kube_cronjob_status_last_successful_time{namespace="garage",cronjob="garage-rclone-copy"} > 93600) or ((time() - kube_cronjob_created{namespace="garage",cronjob="garage-rclone-copy"} > 93600) unless on(namespace,cronjob) kube_cronjob_status_last_successful_time{namespace="garage",cronjob="garage-rclone-copy"})
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Garage off-site copy to smb-32tb has not succeeded in 26 hours
