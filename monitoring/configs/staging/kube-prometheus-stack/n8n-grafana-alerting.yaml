apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-grafana-alerting
  namespace: monitoring
  labels:
    grafana_alert: '1'
data:
  n8n-alerting.yaml: "apiVersion: 1\ncontactPoints:\n- orgId: 1\n  name: n8n-telegram\n  receivers:\n  - uid: n8n-telegram\n    type: telegram\n    disableResolveMessage: false\n    settings:\n      bottoken: $TELEGRAM_BOT_TOKEN\n      chatid: '8801372220'\ngroups:\n- orgId: 1\n  name: n8n-multitenant\n  folder: n8n\n  interval: 1m\n  rules:\n  - uid: n8n-down\n    title: n8n down\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      service: n8n\n    annotations:\n      summary: n8n in {{ $labels.namespace }} has no available replica\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: kube_deployment_status_replicas_available{deployment=\"n8n\",namespace=~\"n8n-.*\"}\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid:\
    \ __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: lt\n            params:\n            - 1\n  - uid: n8n-restarts\n    title: n8n restarting\n    condition: C\n    for: 0m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: n8n in {{ $labels.namespace }} restarted more than twice in 30m\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: sum by (namespace) (increase(kube_pod_container_status_restarts_total{container=\"n8n\",namespace=~\"n8n-.*\"}[30m]))\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n    \
    \    conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 2\n  - uid: n8n-memory\n    title: n8n memory near limit\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: n8n in {{ $labels.namespace }} above 90% of its memory limit\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: sum by (namespace) (container_memory_working_set_bytes{container=\"n8n\",namespace=~\"n8n-.*\"}) / sum by (namespace) (kube_pod_container_resource_limits{container=\"n8n\",resource=\"memory\",namespace=~\"n8n-.*\"})\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n\
    \        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 0.9\n  - uid: n8n-cpu-throttle\n    title: n8n CPU throttled\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: n8n in {{ $labels.namespace }} CPU-throttled over 50%\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: sum by (namespace) (rate(container_cpu_cfs_throttled_periods_total{container=\"n8n\",namespace=~\"n8n-.*\"}[10m])) / sum by (namespace) (rate(container_cpu_cfs_periods_total{container=\"n8n\",namespace=~\"n8n-.*\"}[10m]))\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression:\
    \ A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 0.5\n  - uid: cnpg-down\n    title: homelab-postgres instance not scraped\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      service: n8n\n    annotations:\n      summary: CNPG collector down for {{ $labels.pod }} (or metrics missing)\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: cnpg_collector_up{namespace=\"database\"} or (0 * absent(cnpg_collector_up{namespace=\"database\"}))\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: lt\n            params:\n\
    \            - 1\n  - uid: cnpg-replicas\n    title: homelab-postgres replicas missing\n    condition: C\n    for: 10m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: homelab-postgres primary has fewer than 2 streaming replicas\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: max(cnpg_pg_replication_streaming_replicas{namespace=\"database\"})\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: lt\n            params:\n            - 2\n  - uid: cnpg-lag\n    title: homelab-postgres replication lag\n    condition: C\n    for: 10m\n    noDataState:\
    \ OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: '{{ $labels.pod }} replication lag above 60s'\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: max by (pod) (cnpg_pg_replication_lag{namespace=\"database\"})\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 60\n  - uid: cnpg-wal-archive\n    title: homelab-postgres WAL archiving failing\n    condition: C\n    for: 0m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: WAL archive failures\
    \ (inert until WAL archiving is configured)\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: sum(increase(cnpg_pg_stat_archiver_failed_count{namespace=\"database\"}[30m]))\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 0\n  - uid: n8n-backup-failed\n    title: n8n DB backup failed\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: pg_dump backup Job failed in {{ $labels.namespace }}\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n     \
    \ relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: max by (namespace) (kube_job_failed{job_name=~\"n8n-db-backup-.*\",condition=\"true\",namespace=~\"n8n-.*\"})\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 0\n  - uid: n8n-backup-stale\n    title: n8n DB backup stale\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: No successful pg_dump in {{ $labels.namespace }} for 26h\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n\
    \        refId: A\n        expr: time() - kube_cronjob_status_last_successful_time{cronjob=\"n8n-db-backup\",namespace=~\"n8n-.*\"}\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 93600\n  - uid: n8n-pvc-usage\n    title: n8n/Postgres PVC almost full\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: n8n\n    annotations:\n      summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} above 85%\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace=~\"\
    n8n-.*|database\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"n8n-.*|database\"})\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 0.85\n  - uid: tls-cert-expiry\n    title: TLS certificate expiring\n    condition: C\n    for: 1h\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      service: n8n\n    annotations:\n      summary: Certificate {{ $labels.cn }} expires in under 14 days (or Traefik cert metric missing)\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: min by (cn) ((traefik_tls_certs_not_after - time()) / 86400) or (0 * absent(traefik_tls_certs_not_after))\n\
    \        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: lt\n            params:\n            - 14\n  - uid: pg-backup-failed\n    title: homelab-postgres backup failed\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: postgres\n    annotations:\n      summary: homelab-postgres nightly backup Job failed\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: max(kube_job_failed{namespace=\"database\",job_name=~\"homelab-postgres-backup-.*\",condition=\"true\"})\n        instant: true\n        range: false\n    - refId: C\n      datasourceUid: __expr__\n      model:\n\
    \        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 0\n  - uid: pg-backup-stale\n    title: homelab-postgres backup stale\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      service: postgres\n    annotations:\n      summary: No successful homelab-postgres backup for 26h (or never)\n    notification_settings:\n      receiver: n8n-telegram\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        expr: (time() - kube_cronjob_status_last_successful_time{namespace=\"database\",cronjob=\"homelab-postgres-backup\"}) or (0 * absent(kube_cronjob_status_last_successful_time{namespace=\"database\",cronjob=\"homelab-postgres-backup\"}) + 1e9)\n        instant: true\n        range: false\n    - refId: C\n     \
    \ datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - evaluator:\n            type: gt\n            params:\n            - 93600\n"
