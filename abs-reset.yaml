apiVersion: v1
kind: Pod
metadata:
  name: abs-reset
  namespace: audiobookshelf
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
  containers:
    - name: sqlite
      image: keinos/sqlite3
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: config
          mountPath: /config
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: audiobookshelf-data
